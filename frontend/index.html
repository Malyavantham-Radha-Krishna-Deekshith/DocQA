<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Q&amp;A</title>
  <link rel="stylesheet" href="dist/output.css" />
</head>
<body class="h-screen overflow-hidden bg-slate-50 text-slate-900 antialiased dark:bg-slate-900 dark:text-slate-100">

  <!-- Wake-up overlay: shown until the backend responds to /api/health -->
  <div id="wake-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-4 bg-slate-50 dark:bg-slate-900">
    <div class="spinner h-8 w-8 text-brand-600"></div>
    <p id="wake-message" class="max-w-sm text-center text-sm text-slate-600 dark:text-slate-400">Connecting…</p>
  </div>

  <!-- Toasts -->
  <div id="toast-container" class="fixed bottom-24 right-4 z-40 flex flex-col gap-2"></div>

  <div id="app" class="hidden h-full flex-col">
    <!-- Header -->
    <header class="flex shrink-0 items-center justify-between border-b border-slate-200 px-4 py-3 dark:border-slate-700">
      <div>
        <h1 class="text-base font-bold tracking-tight sm:text-lg">📄 Image Q&amp;A</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Ask questions grounded strictly in your uploaded images.</p>
      </div>
      <button id="new-chat-btn" type="button" class="btn-secondary text-sm">New chat</button>
    </header>

    <!-- Chat log -->
    <main id="chat-log-wrap" class="flex-1 overflow-y-auto">
      <div id="chat-log" class="mx-auto flex min-h-full w-full max-w-3xl flex-col gap-4 px-4 py-6">
        <div id="chat-empty-state" class="flex flex-1 flex-col items-center justify-center gap-3 py-12 text-center text-slate-400 dark:text-slate-500">
          <svg class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 0 1-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8Z" />
          </svg>
          <p class="max-w-xs text-sm">Attach a photo of a document — or drop one anywhere on this page — then ask a question about it.</p>
        </div>
      </div>
    </main>

    <!-- Composer -->
    <div class="shrink-0 border-t border-slate-200 bg-slate-50 px-4 py-3 dark:border-slate-700 dark:bg-slate-900">
      <div class="mx-auto max-w-3xl">
        <div id="attachment-tray" class="mb-2 flex flex-wrap gap-2"></div>

        <form id="chat-form" class="flex items-center gap-1.5 rounded-2xl border border-slate-300 bg-white p-1.5 shadow-sm dark:border-slate-600 dark:bg-slate-800">
          <button id="attach-btn" type="button" title="Attach image"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-slate-700 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-slate-200">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 0 1-6.364-6.364l10.94-10.94A3 3 0 1 1 19.5 7.372L8.552 18.32m.009-.01-.01.01m5.699-9.941-7.81 7.81a1.5 1.5 0 0 0 2.112 2.13" />
            </svg>
          </button>
          <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp" multiple class="sr-only" />

          <button id="camera-btn" type="button" title="Take a photo"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-slate-700 dark:text-slate-400 dark:hover:bg-slate-700 dark:hover:text-slate-200">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
            </svg>
          </button>

          <input id="chat-input" type="text" autocomplete="off" placeholder="Ask a question about your documents…"
            class="min-w-0 flex-1 bg-transparent px-1 py-2 text-sm placeholder:text-slate-400 focus:outline-none" />

          <button id="chat-send" type="submit" disabled title="Send"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-brand-600 text-white transition hover:bg-brand-700 disabled:cursor-not-allowed disabled:bg-slate-200 disabled:text-slate-400 dark:disabled:bg-slate-700 dark:disabled:text-slate-500">
            <svg id="chat-send-icon" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" transform="rotate(90 12 12)" />
            </svg>
            <span id="chat-send-spinner" class="spinner hidden"></span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Camera capture modal -->
  <div id="camera-panel" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/70 p-4">
    <div class="card w-full max-w-lg">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-semibold">Camera</h2>
        <button id="camera-close" type="button" class="text-sm text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">Close</button>
      </div>
      <div class="mt-3 overflow-hidden rounded-xl bg-black">
        <video id="camera-video" class="mx-auto max-h-96 w-full object-contain" autoplay playsinline></video>
      </div>
      <canvas id="camera-canvas" class="hidden"></canvas>
      <div class="mt-3 flex justify-center">
        <button id="camera-capture" type="button" class="btn-primary">Capture</button>
      </div>
    </div>
  </div>

  <!-- Drag-and-drop overlay -->
  <div id="drop-overlay" class="pointer-events-none fixed inset-0 z-30 hidden items-center justify-center border-4 border-dashed border-brand-500 bg-brand-500/10">
    <p class="rounded-lg bg-white px-4 py-2 text-sm font-medium text-brand-700 shadow dark:bg-slate-800 dark:text-brand-300">Drop to attach</p>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
